<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog | Shepherd Media Group</title>
<link rel="icon" href="/img/logo.jpg">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/"><img src="/img/logo.jpg" alt="SMG logo"><span>Shepherd <b>Media</b> Group</span></a>
  <button class="burger" aria-label="Menu">☰</button>
  <nav class="main"><a href="/#packages">Packages</a><a href="/#gallery">Gallery</a><a href="/#about">About</a><a href="/blog.html">Blog</a><a class="btn btn-red btn-sm" href="/#packages">Get a quote</a></nav>
</div></header>
<section><div class="wrap"><article class="full" id="art"><p>Loading…</p></article>
  <p style="text-align:center;margin-top:30px"><a class="btn btn-ghost" href="/blog.html">← All stories</a></p></div></section>
<footer><div class="wrap"><div class="copy" style="border:0;margin:0">© Shepherd Media Group · <span data-s="phone"></span></div></div></footer>
<a class="wa" data-wa href="#" target="_blank" rel="noopener">💬 WhatsApp</a>
<script src="/js/site.js"></script>
<script>
(async () => {
  const slug = location.pathname.split('/').pop();
  const p = await api('/posts/' + encodeURIComponent(slug));
  const art = document.getElementById('art');
  if (p.error) { art.innerHTML = '<h2>Post not found</h2>'; return; }
  document.title = p.title + ' | Shepherd Media Group';
  art.innerHTML = `<div class="eyebrow">${esc(p.created_at.slice(0, 10))}</div><h2>${esc(p.title)}</h2>` +
    (p.cover ? `<img class="cover" src="${esc(p.cover)}" alt="">` : '') +
    p.body.split(/\n{2,}/).map((b) => `<p>${esc(b).replace(/\n/g, '<br>')}</p>`).join('');
})();
</script>
</body>
</html>
